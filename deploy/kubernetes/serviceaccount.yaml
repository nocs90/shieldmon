# ShieldMon needs no Kubernetes API access: the token is not mounted. For Amazon ECR, annotate
# the service account for IRSA with a role holding deploy/iam/shieldmon-readonly.json (or use
# EKS Pod Identity); for Artifact Registry, Workload Identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shieldmon
  labels:
    app.kubernetes.io/name: shieldmon
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/shieldmon-readonly
automountServiceAccountToken: false

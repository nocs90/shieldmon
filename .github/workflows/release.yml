# Release pipeline (docs/processes/release.md): on a signed v* tag on main, build reproducible
# binaries with goreleaser, an SBOM of each archive, a keyless cosign signature of the checksums,
# SLSA build provenance, and the container image, signed and attested. The release is a draft
# until a maintainer publishes it.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the draft release and its assets
      id-token: write      # keyless signing and provenance with the workflow's OIDC identity
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the changelog reads the history
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # syft writes the SBOMs; checksum- and signature-verified like in CI.
      - name: Install pinned scanners
        run: |
          scripts/install-scanners.sh "$RUNNER_TEMP/scanners"
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # ghcr.io/nocs90/shieldmon
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build and push linux/amd64 and linux/arm64
        id: build
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --use --name shieldmon --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${TAG#v}" \
            --tag "ghcr.io/nocs90/shieldmon:${TAG#v}" \
            --metadata-file "$RUNNER_TEMP/metadata.json" --push .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nocs90/shieldmon@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nocs90/shieldmon
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

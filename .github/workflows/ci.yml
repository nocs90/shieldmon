name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *" # daily: integration against fresh vulnerability DBs + longer fuzzing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every gate is documented in docs/processes/quality-gates.md.
# Actions are pinned by full commit SHA (tag in the comment), never by tag.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: make fmt-check vet tidy-check
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap for the scanner sandbox tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bubblewrap
      # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor and the distro
      # package ships no profile for bwrap (docs/adr/0011-scanner-sandbox.md).
      - name: Allow bubblewrap to create user namespaces
        run: |
          sudo install -m 0644 deploy/apparmor/shieldmon-bwrap /etc/apparmor.d/shieldmon-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/shieldmon-bwrap
      - run: make test-race
        env:
          SHIELDMON_TEST_SANDBOX: bwrap,landlock # fail instead of skipping when a backend cannot run here
      - run: make cover
      - run: make build
      - run: make vuln
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # bwrap under AppArmor's own bwrap-userns-restrict profile, the one recommended for shared
  # hosts (deploy/apparmor): it confines what bwrap starts to a profile without capabilities,
  # where deploy/apparmor/shieldmon-bwrap leaves it unconfined. Both attach to /usr/bin/bwrap,
  # so they cannot be loaded in the same job.
  sandbox-apparmor-restrict:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap and AppArmor's bwrap-userns-restrict profile
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap apparmor-profiles
          profile=$(dpkg -L apparmor-profiles | grep -m1 '/bwrap-userns-restrict$')
          echo "profile: $profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - run: go test -race -run '^(TestSandboxBackendsConform|TestBwrapSandbox)$/^bwrap$' ./internal/scanner
        env:
          SHIELDMON_TEST_SANDBOX: bwrap

  fuzz:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Fuzz hostile-input parsers
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '20s' }}
        run: make fuzz FUZZTIME="$FUZZTIME"

  integration:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run/integration')
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install pinned scanners (checksum-verified)
        run: |
          scripts/install-scanners.sh "$RUNNER_TEMP/scanners"
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      # Real scanners and the hostile fixture suite run in the default sandbox, which picks
      # bwrap here; e2e-ubi9-node installs no bwrap, so it covers landlock.
      - name: Install bubblewrap and allow it to create user namespaces
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo install -m 0644 deploy/apparmor/shieldmon-bwrap /etc/apparmor.d/shieldmon-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/shieldmon-bwrap
      - run: make test-integration
        env:
          SHIELDMON_TEST_SANDBOX: bwrap # running unconfined is a failure here

  # End-to-end ConMon scenario on a real multi-stage UBI 9 + Node.js build:
  # scan, triage, remediation decision policy, rebuild, evidence-based closure, reports.
  e2e-ubi9-node:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run/integration')
    runs-on: ubuntu-24.04
    needs: test
    services:
      registry:
        image: docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install pinned scanners (checksum-verified)
        run: |
          scripts/install-scanners.sh "$RUNNER_TEMP/scanners"
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      - run: make build
      - run: python3 examples/ubi9-node/e2e.py --builder docker --registry localhost:5000
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: e2e-ubi9-node-reports
          path: |
            dist/e2e-ubi9-node/report.html
            dist/e2e-ubi9-node/report.md
            dist/e2e-ubi9-node/remediation-plan.csv
          retention-days: 30

  # Container image (docs/adr/0012-container-image.md): multi-arch build, configuration checks
  # and a smoke test on every change; a scan run by the image, and a scan of the image, on
  # main, nightly and PRs labelled run/integration. The only image this job runs is
  # ShieldMon's own, built here; scanned images are never run.
  image:
    runs-on: ubuntu-24.04
    needs: test
    services:
      registry:
        image: docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build linux/amd64 and linux/arm64
        run: |
          docker buildx create --use --name shieldmon --driver docker-container \
            --driver-opt network=host \
            --driver-opt image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            --tag localhost:5000/shieldmon:ci --push .
          # The builder's cache is several GB, and a public runner has about 14 GB of disk:
          # the scans below need it for the vulnerability DBs.
          docker buildx rm shieldmon
      - name: Check the image (non-root, entrypoint, binaries of the right architecture)
        run: |
          go build -o bin/crane github.com/google/go-containerregistry/cmd/crane
          python3 scripts/check-image.py bin/crane localhost:5000/shieldmon:ci
      # As a deployment runs it: read-only root, no capabilities, no_new_privs, Docker's
      # default seccomp profile. Landlock must be available inside it.
      - name: Smoke-test the image (starts; landlock available in a container)
        run: |
          docker pull -q localhost:5000/shieldmon:ci
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network none localhost:5000/shieldmon:ci version
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network none localhost:5000/shieldmon:ci plugins | tee "$RUNNER_TEMP/plugins.txt"
          grep -E '^ +landlock .*\(available\)$' "$RUNNER_TEMP/plugins.txt"
      # Both scans run in the container with one data volume, so the vulnerability DBs are
      # downloaded once. Host networking reaches the registry service on localhost:5000.
      - name: Scan from inside the container (real scanners under landlock)
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run/integration')
        run: |
          df -h /
          sc() {
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              --network host -v shieldmon-data:/data localhost:5000/shieldmon:ci "$@"
          }
          sc scan docker.io/library/alpine@sha256:c0669ef34cdc14332c0f1ab0c2c01acb91d96014b172f1a76f3a39e63d1f0bda
          sc scan localhost:5000/shieldmon:ci
          sc findings list
          sc health
          df -h /

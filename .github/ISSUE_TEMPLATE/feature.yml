name: Feature request
description: Propose new behaviour
title: "feat: "
labels: ["kind/feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which ConMon task is slow, manual or impossible today? Who does it?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Behaviour, CLI/config shape, and which SPEC requirement (F*/S*) it serves.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Executable checks that prove it works ("given … when … then …").
    validations: { required: true }
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: New inputs, credentials, network calls, or closure paths? See THREAT_MODEL.md.

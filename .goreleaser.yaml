# Release build of ShieldMon (docs/processes/release.md). Run by .github/workflows/release.yml
# on a v* tag; locally: goreleaser release --snapshot --clean --skip=sign,sbom,publish.
version: 2
project_name: shieldmon

builds:
  - id: shieldmon
    main: ./cmd/shieldmon
    binary: shieldmon
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Reproducible: no paths, no build ID, timestamps from the commit.
    flags: [-trimpath]
    ldflags:
      - -s -w -buildid= -X github.com/nocs90/shieldmon/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: { mtime: "{{ .CommitDate }}" }
      - src: README.md
        info: { mtime: "{{ .CommitDate }}" }
      - src: SECURITY.md
        info: { mtime: "{{ .CommitDate }}" }

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# An SBOM of each archive, CycloneDX, by the syft scripts/install-scanners.sh installs.
sboms:
  - artifacts: archive
    documents: ["${artifact}.cdx.json"]
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Keyless signature of the checksums file with the workflow's GitHub OIDC identity: verifying
# it covers every archive and SBOM listed in it.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    output: true

changelog:
  use: git
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?(\(.+\))??!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude: ['^docs:', '^test:', '^chore:', '^ci:']

release:
  # Published by a maintainer after reading the notes.
  draft: true
  prerelease: auto
